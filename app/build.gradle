plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
}

def BUILD_DATE = getBuildDate()

static def getBuildDate() {
    def date = new Date()
    def formattedDate = date.format("yyyy-MM-dd' 'HH:mm:ss' '")
    return formattedDate
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
} else {
    localProperties.setProperty("KEYSTORE_FILE", System.getenv("KEYSTORE_FILE"))
    localProperties.setProperty("KEYSTORE_PASSWORD", System.getenv("KEYSTORE_PASSWORD"))
    localProperties.setProperty("KEY_ALIAS", System.getenv("KEY_ALIAS"))
    localProperties.setProperty("KEY_PASSWORD", System.getenv("KEY_PASSWORD"))
}

def readSecret = { String propKey, String envKey ->
    def value = localProperties.getProperty(propKey) ?: System.getenv(envKey)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}

// Google's official AdMob test IDs — safe to hardcode
// https://developers.google.com/admob/android/test-ads
def testAdAppId = 'ca-app-pub-3940256099942544~3347511713'
def testBannerAdId = 'ca-app-pub-3940256099942544/6300978111'
def testInterstitialAdId = 'ca-app-pub-3940256099942544/1033173712'

// Release secrets are mandatory — shipping Google's test IDs to production
// users serves no real ads and puts the publisher account at risk. Supply them
// via local.properties or the matching env vars (CI writes them in android.yml).
def releaseAdAppId = readSecret('admob_application_id', 'ADMOB_APPLICATION_ID')
def releaseBannerAdId = readSecret('banner_ad_id', 'BANNER_AD_ID')
def releaseInterstitialAdId = readSecret('interstitial_ad_id', 'INTERSTITIAL_AD_ID')

def missingReleaseSecrets = []
if (!releaseAdAppId) { missingReleaseSecrets << 'admob_application_id (ADMOB_APPLICATION_ID)' }
if (!releaseBannerAdId) { missingReleaseSecrets << 'banner_ad_id (BANNER_AD_ID)' }
if (!releaseInterstitialAdId) { missingReleaseSecrets << 'interstitial_ad_id (INTERSTITIAL_AD_ID)' }

gradle.taskGraph.whenReady { taskGraph ->
    if (missingReleaseSecrets.isEmpty()) return
    def needsRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (needsRelease) {
        throw new GradleException(
                "[AdMob] Missing release secret(s): ${missingReleaseSecrets.join(', ')}. " +
                        "Set them in local.properties or as environment variables before building release.")
    }
}

// Placeholders so debug-only builds still configure without the release secrets.
if (!releaseAdAppId) { releaseAdAppId = testAdAppId }
if (!releaseBannerAdId) { releaseBannerAdId = testBannerAdId }
if (!releaseInterstitialAdId) { releaseInterstitialAdId = testInterstitialAdId }

android {
    signingConfigs {
        release {
            storeFile file(localProperties.getProperty("KEYSTORE_FILE"))
            storePassword localProperties.getProperty("KEYSTORE_PASSWORD")
            keyAlias localProperties.getProperty("KEY_ALIAS")
            keyPassword localProperties.getProperty("KEY_PASSWORD")
        }
    }

    namespace 'com.ahmadabuhasan.qrbarcode'
    compileSdk 36
    buildToolsVersion = "36.1.0"

    defaultConfig {
        applicationId "com.ahmadabuhasan.qrbarcode"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 13
        versionName "1.0.12"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    ndkVersion "28.2.13676358"
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix " build:" + BUILD_DATE
            signingConfig signingConfigs.release

            resValue "string", "AdMob_Application_ID", releaseAdAppId

            externalNativeBuild {
                cmake {
                    cppFlags "-Dbanner_ad_id=${releaseBannerAdId}",
                            "-Dinterstitial_ad_id=${releaseInterstitialAdId}"
                }
            }
        }
        debug {
            debuggable true

            resValue "string", "AdMob_Application_ID", testAdAppId

            externalNativeBuild {
                cmake {
                    cppFlags "-Dbanner_ad_id=${testBannerAdId}",
                            "-Dinterstitial_ad_id=${testInterstitialAdId}"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'me.dm7.barcodescanner:zxing:1.9.8'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    implementation 'com.hbb20:ccp:2.7.3'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}